<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="20"/>
  
  <!-- Computer/Book Icon -->
  <g transform="translate(150, 80)">
    <!-- Book base -->
    <rect x="0" y="20" width="100" height="120" rx="5" fill="url(#iconGrad)" opacity="0.9"/>
    <rect x="10" y="30" width="80" height="100" rx="3" fill="white" opacity="0.3"/>
    
    <!-- Code lines -->
    <rect x="20" y="50" width="40" height="4" rx="2" fill="white" opacity="0.8"/>
    <rect x="20" y="60" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
    <rect x="20" y="70" width="50" height="4" rx="2" fill="white" opacity="0.8"/>
    <rect x="20" y="80" width="35" height="4" rx="2" fill="white" opacity="0.6"/>
    <rect x="20" y="90" width="55" height="4" rx="2" fill="white" opacity="0.8"/>
    <rect x="20" y="100" width="45" height="4" rx="2" fill="white" opacity="0.6"/>
    
    <!-- Arrow pointing up -->
    <polygon points="50,0 30,30 40,30 40,20 60,20 60,30 70,30" fill="url(#iconGrad)"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#003366" stroke-width="2" opacity="0.2"/>
  <circle cx="350" cy="250" r="40" fill="none" stroke="#0066CC" stroke-width="2" opacity="0.2"/>
  <circle cx="320" cy="80" r="20" fill="none" stroke="#003366" stroke-width="2" opacity="0.15"/>
  
  <!-- Text -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="18" fill="#003366" text-anchor="middle" font-weight="bold">职业发展指北</text>
</svg>
